services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  backend:
    image: mycdigitalizaciones-backend-prod
    build:
      context: ./backend
      target: production
    restart: unless-stopped
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/0
      APP_ENV: production
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in .env}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY in .env}
      PERSONAL_DATA_ENCRYPTION_KEY: ${PERSONAL_DATA_ENCRYPTION_KEY:?set PERSONAL_DATA_ENCRYPTION_KEY in .env}
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?set DJANGO_ALLOWED_HOSTS in .env}
      MEDIA_ROOT: /app/media
      SID_MODE: ${SID_MODE:-disabled}
      SID_BASE_URL: ${SID_BASE_URL:-}
      SID_ACCESS_TOKEN: ${SID_ACCESS_TOKEN:-}
      MERCADOPAGO_ACCESS_TOKEN: ${MERCADOPAGO_ACCESS_TOKEN:-}
      MERCADOPAGO_WEBHOOK_SECRET: ${MERCADOPAGO_WEBHOOK_SECRET:-}
      MERCADOPAGO_COLLECTOR_ID: ${MERCADOPAGO_COLLECTOR_ID:-}
      MERCADOPAGO_LIVE_MODE: ${MERCADOPAGO_LIVE_MODE:-false}
      MERCADOPAGO_WEBHOOK_TOLERANCE_SECONDS: ${MERCADOPAGO_WEBHOOK_TOLERANCE_SECONDS:-300}
      CORREO_ARGENTINO_ENABLED: ${CORREO_ARGENTINO_ENABLED:-false}
      CORREO_ARGENTINO_ENVIRONMENT: ${CORREO_ARGENTINO_ENVIRONMENT:-qa}
      CORREO_ARGENTINO_QA_BASE_URL: ${CORREO_ARGENTINO_QA_BASE_URL:-https://apitest.correoargentino.com.ar/micorreo/v1}
      CORREO_ARGENTINO_PRODUCTION_BASE_URL: ${CORREO_ARGENTINO_PRODUCTION_BASE_URL:-https://api.correoargentino.com.ar/micorreo/v1}
      CORREO_ARGENTINO_USERNAME: ${CORREO_ARGENTINO_USERNAME:-}
      CORREO_ARGENTINO_PASSWORD: ${CORREO_ARGENTINO_PASSWORD:-}
      CORREO_ARGENTINO_CUSTOMER_ID: ${CORREO_ARGENTINO_CUSTOMER_ID:-}
      CORREO_ARGENTINO_ORIGIN_POSTAL_CODE: ${CORREO_ARGENTINO_ORIGIN_POSTAL_CODE:-}
      SHIPPING_SURCHARGE_TYPE: ${SHIPPING_SURCHARGE_TYPE:-exact}
      SHIPPING_SURCHARGE_VALUE: ${SHIPPING_SURCHARGE_VALUE:-0}
      SHIPPING_FREE_THRESHOLD: ${SHIPPING_FREE_THRESHOLD:-}
    depends_on:
      - postgres
      - redis
    volumes:
      - media_data:/app/media

  worker:
    image: mycdigitalizaciones-worker-prod
    build:
      context: ./backend
      target: production
    restart: unless-stopped
    command: celery -A config worker --loglevel=INFO
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/0
      APP_ENV: production
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in .env}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY in .env}
      PERSONAL_DATA_ENCRYPTION_KEY: ${PERSONAL_DATA_ENCRYPTION_KEY:?set PERSONAL_DATA_ENCRYPTION_KEY in .env}
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?set DJANGO_ALLOWED_HOSTS in .env}
      SID_MODE: ${SID_MODE:-disabled}
      SID_BASE_URL: ${SID_BASE_URL:-}
      SID_ACCESS_TOKEN: ${SID_ACCESS_TOKEN:-}
      MERCADOPAGO_ACCESS_TOKEN: ${MERCADOPAGO_ACCESS_TOKEN:-}
      MERCADOPAGO_WEBHOOK_SECRET: ${MERCADOPAGO_WEBHOOK_SECRET:-}
      MERCADOPAGO_COLLECTOR_ID: ${MERCADOPAGO_COLLECTOR_ID:-}
      MERCADOPAGO_LIVE_MODE: ${MERCADOPAGO_LIVE_MODE:-false}
      MERCADOPAGO_WEBHOOK_TOLERANCE_SECONDS: ${MERCADOPAGO_WEBHOOK_TOLERANCE_SECONDS:-300}
      CORREO_ARGENTINO_ENABLED: ${CORREO_ARGENTINO_ENABLED:-false}
      CORREO_ARGENTINO_ENVIRONMENT: ${CORREO_ARGENTINO_ENVIRONMENT:-qa}
      CORREO_ARGENTINO_QA_BASE_URL: ${CORREO_ARGENTINO_QA_BASE_URL:-https://apitest.correoargentino.com.ar/micorreo/v1}
      CORREO_ARGENTINO_PRODUCTION_BASE_URL: ${CORREO_ARGENTINO_PRODUCTION_BASE_URL:-https://api.correoargentino.com.ar/micorreo/v1}
      CORREO_ARGENTINO_USERNAME: ${CORREO_ARGENTINO_USERNAME:-}
      CORREO_ARGENTINO_PASSWORD: ${CORREO_ARGENTINO_PASSWORD:-}
      CORREO_ARGENTINO_CUSTOMER_ID: ${CORREO_ARGENTINO_CUSTOMER_ID:-}
      CORREO_ARGENTINO_ORIGIN_POSTAL_CODE: ${CORREO_ARGENTINO_ORIGIN_POSTAL_CODE:-}
      SHIPPING_SURCHARGE_TYPE: ${SHIPPING_SURCHARGE_TYPE:-exact}
      SHIPPING_SURCHARGE_VALUE: ${SHIPPING_SURCHARGE_VALUE:-0}
      SHIPPING_FREE_THRESHOLD: ${SHIPPING_FREE_THRESHOLD:-}
    depends_on:
      - postgres
      - redis

  beat:
    image: mycdigitalizaciones-worker-prod
    build:
      context: ./backend
      target: production
    restart: unless-stopped
    command: celery -A config beat --loglevel=INFO
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/0
      APP_ENV: production
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in .env}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY in .env}
      PERSONAL_DATA_ENCRYPTION_KEY: ${PERSONAL_DATA_ENCRYPTION_KEY:?set PERSONAL_DATA_ENCRYPTION_KEY in .env}
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?set DJANGO_ALLOWED_HOSTS in .env}
      SID_MODE: ${SID_MODE:-disabled}
      SID_BASE_URL: ${SID_BASE_URL:-}
      SID_ACCESS_TOKEN: ${SID_ACCESS_TOKEN:-}
      MERCADOPAGO_ACCESS_TOKEN: ${MERCADOPAGO_ACCESS_TOKEN:-}
      MERCADOPAGO_WEBHOOK_SECRET: ${MERCADOPAGO_WEBHOOK_SECRET:-}
      MERCADOPAGO_COLLECTOR_ID: ${MERCADOPAGO_COLLECTOR_ID:-}
      MERCADOPAGO_LIVE_MODE: ${MERCADOPAGO_LIVE_MODE:-false}
      MERCADOPAGO_WEBHOOK_TOLERANCE_SECONDS: ${MERCADOPAGO_WEBHOOK_TOLERANCE_SECONDS:-300}
      CORREO_ARGENTINO_ENABLED: ${CORREO_ARGENTINO_ENABLED:-false}
      CORREO_ARGENTINO_ENVIRONMENT: ${CORREO_ARGENTINO_ENVIRONMENT:-qa}
      CORREO_ARGENTINO_QA_BASE_URL: ${CORREO_ARGENTINO_QA_BASE_URL:-https://apitest.correoargentino.com.ar/micorreo/v1}
      CORREO_ARGENTINO_PRODUCTION_BASE_URL: ${CORREO_ARGENTINO_PRODUCTION_BASE_URL:-https://api.correoargentino.com.ar/micorreo/v1}
      CORREO_ARGENTINO_USERNAME: ${CORREO_ARGENTINO_USERNAME:-}
      CORREO_ARGENTINO_PASSWORD: ${CORREO_ARGENTINO_PASSWORD:-}
      CORREO_ARGENTINO_CUSTOMER_ID: ${CORREO_ARGENTINO_CUSTOMER_ID:-}
      CORREO_ARGENTINO_ORIGIN_POSTAL_CODE: ${CORREO_ARGENTINO_ORIGIN_POSTAL_CODE:-}
      SHIPPING_SURCHARGE_TYPE: ${SHIPPING_SURCHARGE_TYPE:-exact}
      SHIPPING_SURCHARGE_VALUE: ${SHIPPING_SURCHARGE_VALUE:-0}
      SHIPPING_FREE_THRESHOLD: ${SHIPPING_FREE_THRESHOLD:-}
    depends_on:
      - postgres
      - redis

  frontend:
    image: mycdigitalizaciones-frontend-prod
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: production
    restart: unless-stopped
    environment:
      NODE_ENV: production

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in .env}
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - media_data:/srv/media:ro
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  media_data:
