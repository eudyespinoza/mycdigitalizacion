{% extends "admin/base_site.html" %}
{% block title %}Ajustar stock · {{ variant.sku }}{% endblock %}
{% block content %}
  <h1>Ajustar stock · {{ variant.sku }}</h1>
  <p>Stock actual: <strong>{{ variant.on_hand }}</strong>. El cambio generará un movimiento auditable.</p>

{% endblock %}
