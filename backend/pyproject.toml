[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "*_tests.py"]
testpaths = ["tests"]
markers = [
    "postgresql: tests requiring PostgreSQL row locking semantics",
    "sandbox: opt-in smoke tests requiring external sandbox credentials",
]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
