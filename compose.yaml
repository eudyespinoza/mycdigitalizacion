services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mycdigitalizacion}
      POSTGRES_USER: ${POSTGRES_USER:-mycdigitalizacion}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-for-local-development}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 60s

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: mycdigitalizaciones-backend-dev
    build:
      context: ./backend
      target: development
    command: python manage.py runserver 0.0.0.0:8000
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mycdigitalizacion}
      POSTGRES_USER: ${POSTGRES_USER:-mycdigitalizacion}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-for-local-development}
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/0
      APP_ENV: development
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-unsafe-development-key-change-me}
      PERSONAL_DATA_ENCRYPTION_KEY: ${PERSONAL_DATA_ENCRYPTION_KEY:-development-only-personal-data-key}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    image: mycdigitalizaciones-worker-dev
    build:
      context: ./backend
      target: development
    command: celery -A config worker --loglevel=INFO
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mycdigitalizacion}
      POSTGRES_USER: ${POSTGRES_USER:-mycdigitalizacion}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-for-local-development}
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/0
      APP_ENV: development
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-unsafe-development-key-change-me}
      PERSONAL_DATA_ENCRYPTION_KEY: ${PERSONAL_DATA_ENCRYPTION_KEY:-development-only-personal-data-key}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    image: mycdigitalizaciones-frontend-dev
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: development
    command: pnpm dev --hostname 0.0.0.0
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
    volumes:
      - ./frontend:/app/frontend
      - frontend_node_modules:/app/frontend/node_modules

  caddy:
    image: caddy:2.10-alpine
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
    volumes:
      - ./infra/caddy/Caddyfile.dev:/etc/caddy/Caddyfile:ro
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
  frontend_node_modules:
