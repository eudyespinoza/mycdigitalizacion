services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mycdigitalizacion}
      POSTGRES_USER: ${POSTGRES_USER:-mycdigitalizacion}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-for-local-development}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 60s

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: mycdigitalizaciones-backend-dev
    build:
      context: ./backend
      target: development
    command: python manage.py runserver 0.0.0.0:8000
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mycdigitalizacion}
      POSTGRES_USER: ${POSTGRES_USER:-mycdigitalizacion}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-for-local-development}
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/0
      APP_ENV: development
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-unsafe-development-key-change-me}
      PERSONAL_DATA_ENCRYPTION_KEY: ${PERSONAL_DATA_ENCRYPTION_KEY:-development-only-personal-data-key}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      MEDIA_ROOT: /app/media
      SID_MODE: ${SID_MODE:-disabled}
      SID_BASE_URL: ${SID_BASE_URL:-}
      SID_ACCESS_TOKEN: ${SID_ACCESS_TOKEN:-}
      MERCADOPAGO_ACCESS_TOKEN: ${MERCADOPAGO_ACCESS_TOKEN:-}
      MERCADOPAGO_WEBHOOK_SECRET: ${MERCADOPAGO_WEBHOOK_SECRET:-}
      MERCADOPAGO_COLLECTOR_ID: ${MERCADOPAGO_COLLECTOR_ID:-}
      MERCADOPAGO_LIVE_MODE: ${MERCADOPAGO_LIVE_MODE:-false}
      MERCADOPAGO_WEBHOOK_TOLERANCE_SECONDS: ${MERCADOPAGO_WEBHOOK_TOLERANCE_SECONDS:-300}
      CORREO_ARGENTINO_ENABLED: ${CORREO_ARGENTINO_ENABLED:-false}
      CORREO_ARGENTINO_ENVIRONMENT: ${CORREO_ARGENTINO_ENVIRONMENT:-qa}
      CORREO_ARGENTINO_QA_BASE_URL: ${CORREO_ARGENTINO_QA_BASE_URL:-https://apitest.correoargentino.com.ar/micorreo/v1}
      CORREO_ARGENTINO_PRODUCTION_BASE_URL: ${CORREO_ARGENTINO_PRODUCTION_BASE_URL:-https://api.correoargentino.com.ar/micorreo/v1}
      CORREO_ARGENTINO_USERNAME: ${CORREO_ARGENTINO_USERNAME:-}
      CORREO_ARGENTINO_PASSWORD: ${CORREO_ARGENTINO_PASSWORD:-}
      CORREO_ARGENTINO_CUSTOMER_ID: ${CORREO_ARGENTINO_CUSTOMER_ID:-}
      CORREO_ARGENTINO_ORIGIN_POSTAL_CODE: ${CORREO_ARGENTINO_ORIGIN_POSTAL_CODE:-}
      SHIPPING_SURCHARGE_TYPE: ${SHIPPING_SURCHARGE_TYPE:-exact}
      SHIPPING_SURCHARGE_VALUE: ${SHIPPING_SURCHARGE_VALUE:-0}
      SHIPPING_FREE_THRESHOLD: ${SHIPPING_FREE_THRESHOLD:-}
    volumes:
      - ./backend:/app
      - media_data:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    image: mycdigitalizaciones-worker-dev
    build:
      context: ./backend
      target: development
    command: celery -A config worker --loglevel=INFO
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mycdigitalizacion}
      POSTGRES_USER: ${POSTGRES_USER:-mycdigitalizacion}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-for-local-development}
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/0
      APP_ENV: development
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-unsafe-development-key-change-me}
      PERSONAL_DATA_ENCRYPTION_KEY: ${PERSONAL_DATA_ENCRYPTION_KEY:-development-only-personal-data-key}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      SID_MODE: ${SID_MODE:-disabled}
      SID_BASE_URL: ${SID_BASE_URL:-}
      SID_ACCESS_TOKEN: ${SID_ACCESS_TOKEN:-}
      MERCADOPAGO_ACCESS_TOKEN: ${MERCADOPAGO_ACCESS_TOKEN:-}
      MERCADOPAGO_WEBHOOK_SECRET: ${MERCADOPAGO_WEBHOOK_SECRET:-}
      MERCADOPAGO_COLLECTOR_ID: ${MERCADOPAGO_COLLECTOR_ID:-}
      MERCADOPAGO_LIVE_MODE: ${MERCADOPAGO_LIVE_MODE:-false}
      MERCADOPAGO_WEBHOOK_TOLERANCE_SECONDS: ${MERCADOPAGO_WEBHOOK_TOLERANCE_SECONDS:-300}
      CORREO_ARGENTINO_ENABLED: ${CORREO_ARGENTINO_ENABLED:-false}
      CORREO_ARGENTINO_ENVIRONMENT: ${CORREO_ARGENTINO_ENVIRONMENT:-qa}
      CORREO_ARGENTINO_QA_BASE_URL: ${CORREO_ARGENTINO_QA_BASE_URL:-https://apitest.correoargentino.com.ar/micorreo/v1}
      CORREO_ARGENTINO_PRODUCTION_BASE_URL: ${CORREO_ARGENTINO_PRODUCTION_BASE_URL:-https://api.correoargentino.com.ar/micorreo/v1}
      CORREO_ARGENTINO_USERNAME: ${CORREO_ARGENTINO_USERNAME:-}
      CORREO_ARGENTINO_PASSWORD: ${CORREO_ARGENTINO_PASSWORD:-}
      CORREO_ARGENTINO_CUSTOMER_ID: ${CORREO_ARGENTINO_CUSTOMER_ID:-}
      CORREO_ARGENTINO_ORIGIN_POSTAL_CODE: ${CORREO_ARGENTINO_ORIGIN_POSTAL_CODE:-}
      SHIPPING_SURCHARGE_TYPE: ${SHIPPING_SURCHARGE_TYPE:-exact}
      SHIPPING_SURCHARGE_VALUE: ${SHIPPING_SURCHARGE_VALUE:-0}
      SHIPPING_FREE_THRESHOLD: ${SHIPPING_FREE_THRESHOLD:-}
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    image: mycdigitalizaciones-worker-dev
    build:
      context: ./backend
      target: development
    command: celery -A config beat --loglevel=INFO
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mycdigitalizacion}
      POSTGRES_USER: ${POSTGRES_USER:-mycdigitalizacion}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-for-local-development}
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/0
      APP_ENV: development
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-unsafe-development-key-change-me}
      PERSONAL_DATA_ENCRYPTION_KEY: ${PERSONAL_DATA_ENCRYPTION_KEY:-development-only-personal-data-key}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      SID_MODE: ${SID_MODE:-disabled}
      SID_BASE_URL: ${SID_BASE_URL:-}
      SID_ACCESS_TOKEN: ${SID_ACCESS_TOKEN:-}
      MERCADOPAGO_ACCESS_TOKEN: ${MERCADOPAGO_ACCESS_TOKEN:-}
      MERCADOPAGO_WEBHOOK_SECRET: ${MERCADOPAGO_WEBHOOK_SECRET:-}
      MERCADOPAGO_COLLECTOR_ID: ${MERCADOPAGO_COLLECTOR_ID:-}
      MERCADOPAGO_LIVE_MODE: ${MERCADOPAGO_LIVE_MODE:-false}
      MERCADOPAGO_WEBHOOK_TOLERANCE_SECONDS: ${MERCADOPAGO_WEBHOOK_TOLERANCE_SECONDS:-300}
      CORREO_ARGENTINO_ENABLED: ${CORREO_ARGENTINO_ENABLED:-false}
      CORREO_ARGENTINO_ENVIRONMENT: ${CORREO_ARGENTINO_ENVIRONMENT:-qa}
      CORREO_ARGENTINO_QA_BASE_URL: ${CORREO_ARGENTINO_QA_BASE_URL:-https://apitest.correoargentino.com.ar/micorreo/v1}
      CORREO_ARGENTINO_PRODUCTION_BASE_URL: ${CORREO_ARGENTINO_PRODUCTION_BASE_URL:-https://api.correoargentino.com.ar/micorreo/v1}
      CORREO_ARGENTINO_USERNAME: ${CORREO_ARGENTINO_USERNAME:-}
      CORREO_ARGENTINO_PASSWORD: ${CORREO_ARGENTINO_PASSWORD:-}
      CORREO_ARGENTINO_CUSTOMER_ID: ${CORREO_ARGENTINO_CUSTOMER_ID:-}
      CORREO_ARGENTINO_ORIGIN_POSTAL_CODE: ${CORREO_ARGENTINO_ORIGIN_POSTAL_CODE:-}
      SHIPPING_SURCHARGE_TYPE: ${SHIPPING_SURCHARGE_TYPE:-exact}
      SHIPPING_SURCHARGE_VALUE: ${SHIPPING_SURCHARGE_VALUE:-0}
      SHIPPING_FREE_THRESHOLD: ${SHIPPING_FREE_THRESHOLD:-}
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    image: mycdigitalizaciones-frontend-dev
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: development
    command: pnpm dev --hostname 0.0.0.0
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
    volumes:
      - ./frontend:/app/frontend
      - frontend_node_modules:/app/frontend/node_modules

  caddy:
    image: caddy:2.10-alpine
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
    volumes:
      - ./infra/caddy/Caddyfile.dev:/etc/caddy/Caddyfile:ro
      - media_data:/srv/media:ro
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
  frontend_node_modules:
  media_data:
